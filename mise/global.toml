# Global mise tool versions — the template for ~/.config/mise/config.toml.
#
# The filename is `global.toml`, not `config.toml`, and that is load-bearing.
# `mise/config.toml` is one of the paths mise auto-detects as a *project-local*
# config, so while the file had that name every mise command and every shim run
# from inside this repo died with "Config files in ~/Developer/dotfiles/
# mise/config.toml are not trusted" — `node -v` and `ruby -v` included.
# `mise trust` would fix it per machine, but it is content-hashed, so every
# edit to this file would break it again. A name mise does not look for has no
# such state. Do not rename it back.
#
# One file for both machines. The `os` filters decide who gets what: mise skips
# a tool whose `os` list does not name the current platform, so nothing
# unreachable is ever installed.
#
# NOT symlinked, and not because it is unsafe: mise writes *through* a symlink
# (the link survives, the target gets the write) and it preserves this comment
# header across a rewrite. Both were tested against mise 2026.8.11 with
# MISE_GLOBAL_CONFIG_FILE pointed at a throwaway copy.
#
# It is copy-by-hand because of the churn. The 13 Omarchy wrappers in
# ~/.local/bin each run `mise use -g <tool>` on *every* launch, and
# `omarchy-install-dev-env` adds more, so a linked file would turn every
# ad-hoc tool install into an uncommitted diff in this repo.
#
#   cp mise/global.toml ~/.config/mise/config.toml   # repo -> home
#   cp ~/.config/mise/config.toml mise/global.toml   # home -> repo
#
# Read the diff before copying home -> repo. `mise use -g` rewrites the entry
# it touches, and whether it preserves an `os` filter is unverified. Check with
# `mise config get tools.node` on the Omarchy box after a wrapper has run.
#
# `mise settings` is empty on purpose, so there is no settings.toml to carry.
#
# Why macOS only takes node and ruby: the shims are *prepended* there (see the
# comment in .zshenv), so an unfiltered entry would put mise in front of
# Homebrew for tools Homebrew already owns and keeps patched. Node and Ruby are
# the two that need a version manager, and they replace nvm and rbenv.
#
# `claude` is load-bearing on Linux: bin/claude resolves the real binary
# through ~/.local/share/mise/installs/claude/latest/ before it falls back to
# anything else. It is Linux-only for exactly the same reason — a mise `claude`
# on macOS would displace the native installer's build under
# ~/.local/share/claude/versions/, and `claude update` would then keep
# maintaining a binary nothing launches.
#
# `ruby` is pinned rather than `latest` because it inherits rbenv's only
# version. mise prefers a precompiled Ruby and falls back to a ruby-build
# compile, so a `latest` bump can cost half an hour of CPU.

[tools]
bun = { version = "latest", os = ["linux"] }
claude = { version = "latest", os = ["linux"] }
codex = { version = "latest", os = ["linux"] }
gh = { version = "latest", os = ["linux"] }
go = { version = "latest", os = ["linux"] }
node = "latest"
pnpm = { version = "latest", os = ["linux"] }
prettier = { version = "latest", os = ["linux"] }
python = { version = "latest", os = ["linux"] }
ruby = { version = "3.4.1", os = ["macos"] }
uv = { version = "latest", os = ["linux"] }
