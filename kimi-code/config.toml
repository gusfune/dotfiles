# ~/.kimi-code/config.toml — source of truth lives in the dotfiles repo and is
# symlinked into place by script/setup. Kimi may rewrite the managed
# providers/models sections on refresh; that's expected churn.

default_plan_mode = true
default_permission_mode = "auto"
merge_all_available_skills = false
telemetry = false
default_model = "kimi-code/k3"

[loop_control]
max_retries_per_step = 3
reserved_context_size = 50000

[background]
max_running_tasks = 4
keep_alive_on_exit = false

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

# Mirrors Claude's effortLevel = "xhigh"; "max" is the top level k3 supports.
[thinking]
enabled = true
effort = "max"

# Permission rules: first match wins, so the deny stays above the allows.
[[permission.rules]]
decision = "deny"
scope = "user"
pattern = "Bash(rm -rf*)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Read"

# Bash allow-list ported from claude/settings.json permissions.allow.
[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(yarn install)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(yarn build*)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(yarn lint*)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(bun install)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(bun *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(git *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(find *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(mkdir *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(tree *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(grep *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(wc *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(ls *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(pwd *)"

[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "Bash(npx tsc *)"

# Read-only Linear MCP tools (no-op until a Linear MCP server is configured).
[[permission.rules]]
decision = "allow"
scope = "user"
pattern = "mcp__Linear__*"

# peon-ping sound hooks (ported from claude/settings.json). Kimi hook payloads
# use the same snake_case fields peon.sh reads (hook_event_name, session_id,
# cwd); observer events are already fire-and-forget, so no async flag needed.
[[hooks]]
event = "SessionStart"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "SessionEnd"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "Stop"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "Notification"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "PreCompact"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "SubagentStart"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "SubagentStop"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[[hooks]]
event = "PostToolUseFailure"
matcher = "Bash"
command = "[ -x ~/.claude/hooks/peon-ping/peon.sh ] && ~/.claude/hooks/peon-ping/peon.sh || true"
timeout = 10

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding"

[models."kimi-code/kimi-for-coding-highspeed"]
provider = "managed:kimi-code"
model = "kimi-for-coding-highspeed"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K2.7 Coding Highspeed"

[models."kimi-code/k3"]
provider = "managed:kimi-code"
model = "k3"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
display_name = "K3"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

[models."kimi-code/k3-256k"]
provider = "managed:kimi-code"
model = "k3-256k"
max_context_size = 262144
capabilities = [ "thinking", "always_thinking", "image_in", "tool_use" ]
display_name = "K3-256k"
support_efforts = [ "low", "high", "max" ]
default_effort = "high"

